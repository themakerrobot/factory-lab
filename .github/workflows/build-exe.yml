name: Build FactoryLab.exe

on:
  push:
    tags: ['v*']        # 예: git tag v0.1 && git push origin v0.1
  workflow_dispatch:     # Actions 탭에서 수동 실행도 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Release 에 exe 첨부용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Stage site files
        run: |
          mkdir -p build/site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='dist' --exclude='tools' --exclude='build' \
            --exclude='*.bat' --exclude='*.zip' --exclude='*.exe' \
            --exclude='.gitignore' --exclude='.assetsignore' --exclude='wrangler.toml' --exclude='README.md' \
            ./ build/site/
          cp tools/portable/main.go tools/portable/go.mod build/

      - name: Embed icon and version info
        # 서명 없는 exe 는 Smart App Control 에 걸린다. 회사명·제품명·버전이 빈 칸이면 더 의심받으므로
        # goversioninfo 로 VERSIONINFO 까지 채운다 (rsrc 는 아이콘만 넣는다).
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          cp tools/portable/icon.ico tools/portable/versioninfo.json build/
          cd build && $(go env GOPATH)/bin/goversioninfo -64 -o resource.syso versioninfo.json

      - name: Build exe
        run: cd build && GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o FactoryLab.exe .

      - name: Upload artifact (수동 실행용)
        uses: actions/upload-artifact@v4
        with:
          name: FactoryLab
          path: build/FactoryLab.exe

      - name: Attach to Release (태그 push 시)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/FactoryLab.exe
